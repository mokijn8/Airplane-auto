name: Auto Draw Airplane Chefs

on:
  # 手动触发：在GitHub网页上点一下 "Run workflow" 按钮就能跑
  workflow_dispatch:
  # 定时触发：每6小时自动跑一次新的一轮（GitHub单次任务最长只能跑6小时，
  # 用定时任务接力，实现近似"一直挂着"的效果）
  schedule:
    - cron: "0 */6 * * *"

jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # 留一点余量，避免卡在GitHub的360分钟硬限制上

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          pip install playwright requests
          python -m playwright install --with-deps chromium

      - name: 运行抽奖脚本
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python auto_draw_v9.py

      - name: 保存中奖记录（如果有的话）
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: winning-links-${{ github.run_id }}
          path: winning_links.txt
          if-no-files-found: ignore
